# ════════════════════════════════════════════════════════
#  MP DÉCAP LASER — Configuration Sveltia CMS
#  Accès : https://votre-site.fr/admin/
# ════════════════════════════════════════════════════════

backend:
  name: github
  repo: MaxFosse/MPDecapLaser
  branch: main
  auth_type: token

media_folder: assets
public_folder: assets

locale: fr

collections:

  # ══════════════════════════════════════════
  #  PAGE D'ACCUEIL
  # ══════════════════════════════════════════
  - name: accueil
    label: "🏠 Page d'accueil"
    files:
      - name: homepage
        label: "Contenu de la page d'accueil"
        file: content/homepage.json
        fields:

          # ── Bandeau tagline ──────────────────
          - name: tagline_banner
            label: "📢 Bandeau haut de page"
            widget: string
            hint: "Texte affiché dans le bandeau doré sous la navigation."

          # ── HÉRO ────────────────────────────
          - name: hero
            label: "🎯 Section héro (premier écran)"
            widget: object
            fields:
              - { name: kicker,        label: "Petite ligne au-dessus du titre (zone géographique)",  widget: string }
              - { name: h1_pre,        label: "Titre principal — premier mot",  widget: string, hint: "Ex : Décapage" }
              - { name: h1_accent,     label: "Titre principal — mot en doré",  widget: string, hint: "Ex : laser" }
              - { name: h1_post,       label: "Titre principal — suite",        widget: string, hint: "Ex : haute précision" }
              - { name: lead,          label: "Texte d'accroche sous le titre", widget: text }
              - { name: btn_primary,   label: "Bouton principal",               widget: string }
              - { name: btn_secondary, label: "Bouton secondaire",              widget: string }
              - name: badges
                label: "Badges (points forts en bas du héro)"
                widget: list
                allow_add: true
                allow_delete: true
                label_singular: Badge
                summary: "{{fields.titre}}"
                fields:
                  - { name: titre, label: "Titre du badge",      widget: string }
                  - { name: sous,  label: "Sous-texte du badge", widget: string }

          # ── RÉALISATIONS ────────────────────
          - name: realisations
            label: "📸 Réalisations (galerie principale)"
            widget: object
            fields:
              - { name: titre, label: "Titre de la section", widget: string }
              - { name: sous,  label: "Sous-titre",          widget: string }
              - name: cartes
                label: "Cartes photos"
                widget: list
                allow_add: true
                allow_delete: true
                label_singular: Photo
                summary: "{{fields.titre}}"
                fields:
                  - { name: image,  label: "Photo",              widget: image }
                  - { name: alt,    label: "Description (SEO)",  widget: string }
                  - { name: titre,  label: "Titre",              widget: string }
                  - { name: desc,   label: "Description",        widget: text }
                  - name: centree
                    label: "Carte centrée (ligne séparée)"
                    widget: boolean
                    default: false
                    hint: "Activez pour les cartes qui apparaissent seules sur leur ligne."
              - name: graffiti
                label: "Bloc graffitis"
                widget: object
                fields:
                  - { name: titre, label: "Titre",                widget: string }
                  - { name: texte, label: "Texte d'introduction", widget: text }
                  - name: applications
                    label: "Applications (liste à puces)"
                    widget: list
                    field: { name: item, label: Application, widget: string }
                  - name: avantages
                    label: "Avantages (liste avec ✓)"
                    widget: list
                    field: { name: item, label: Avantage, widget: string }

          # ── VIDÉO ───────────────────────────
          - name: video
            label: "🎬 Section vidéo"
            widget: object
            fields:
              - { name: kicker, label: "Petite ligne au-dessus du titre", widget: string }
              - { name: titre,  label: "Titre de la section",             widget: string }
              - name: src
                label: "Fichier vidéo"
                widget: file
                hint: "Remplacez la vidéo ici. Formats acceptés : MP4, WebM."
                media_library:
                  config:
                    multiple: false

          # ── ACTIVITÉS ───────────────────────
          - name: activites
            label: "⚙️ Activités (4 domaines d'intervention)"
            widget: object
            fields:
              - { name: kicker, label: "Petite ligne au-dessus du titre", widget: string }
              - { name: titre,  label: "Titre de la section",             widget: string }
              - name: items
                label: "Les 4 activités"
                widget: list
                allow_add: false
                allow_delete: false
                label_singular: Activité
                summary: "{{fields.card_titre}}"
                fields:
                  - { name: id,            label: "Identifiant (ne pas modifier)",          widget: string }
                  - { name: icon,          label: "Icône de la carte",                      widget: image }
                  - { name: card_titre,    label: "Titre de la carte",                      widget: string }
                  - { name: card_desc,     label: "Description de la carte",                widget: text }
                  - { name: detail_kicker, label: "Petite ligne au-dessus du titre détail", widget: string }
                  - { name: detail_titre,  label: "Titre de la page détail",                widget: string }
                  - { name: detail_lead,   label: "Texte d'introduction (page détail)",     widget: text }
                  - { name: detail_image,  label: "Photo (page détail)",                    widget: image }
                  - name: image_droite
                    label: "Image à droite"
                    widget: boolean
                    default: true
                    hint: "Si activé : texte à gauche, image à droite. Sinon : inversé."
                  - name: chips
                    label: "Mots-clés (petites étiquettes)"
                    widget: list
                    required: false
                    hint: "Laissez vide pour Industrie (utilise un bloc d'info à la place)."
                    field: { name: item, label: Mot-clé, widget: string }
                  - name: info_panel
                    label: "Bloc d'applications (Industrie uniquement)"
                    widget: text
                    required: false
                    hint: "Pour Industrie seulement. Laissez vide pour les autres."
                  - name: citation
                    label: "Texte mis en avant avec bordure dorée (Patrimoine uniquement)"
                    widget: string
                    required: false
                    hint: "Laissez vide si inutile."

          # ── PRESTATIONS ─────────────────────
          - name: prestations
            label: "🔧 Prestations"
            widget: object
            fields:
              - { name: titre, label: "Titre de la section", widget: string }
              - { name: sous,  label: "Sous-titre",          widget: text }
              - name: services
                label: "Services (cartes)"
                widget: list
                allow_add: true
                allow_delete: true
                label_singular: Service
                summary: "{{fields.titre}}"
                fields:
                  - { name: titre, label: "Nom du service", widget: string }
                  - name: items
                    label: "Prestations incluses"
                    widget: list
                    field: { name: item, label: Prestation, widget: string }

          # ── TARIFS ──────────────────────────
          - name: tarifs
            label: "💰 Tarifs / Devis"
            widget: object
            fields:
              - { name: titre,            label: "Titre de la section",      widget: string }
              - { name: lead,             label: "Texte d'introduction",     widget: text }
              - { name: panel_titre,      label: "Titre du bloc devis",      widget: string }
              - { name: panel_intro,      label: "Phrase d'intro du bloc",   widget: string }
              - name: panel_items
                label: "Éléments à fournir pour le devis"
                widget: list
                field: { name: item, label: Élément, widget: string }
              - { name: panel_conclusion, label: "Phrase de conclusion",     widget: string }

          # ── CONTACT ─────────────────────────
          - name: contact
            label: "📞 Informations de contact"
            widget: object
            fields:
              - { name: kicker,    label: "Petite ligne au-dessus du titre", widget: string }
              - { name: titre,     label: "Titre de la section",             widget: string }
              - { name: telephone, label: "Téléphone",                       widget: string, hint: "Ex : 06 84 78 99 84" }
              - { name: email,     label: "Email",                           widget: string }
              - { name: adresse,   label: "Adresse",                         widget: string }
              - { name: zone,      label: "Zone d'intervention",             widget: string }
              - { name: tagline,   label: "Slogan affiché sous l'adresse",  widget: string }

  # ══════════════════════════════════════════
  #  PAGE GALERIE
  # ══════════════════════════════════════════
  - name: galerie
    label: "🖼️ Galerie vidéos & photos"
    files:
      - name: galerie
        label: "Contenu de la galerie"
        file: content/galerie.json
        fields:
          - { name: hero_sous,     label: "Texte sous le titre de la galerie",         widget: string }
          - { name: videos_kicker, label: "Petite ligne au-dessus du titre Vidéos",    widget: string }
          - { name: videos_titre,  label: "Titre de la section Vidéos",                widget: string }
          - { name: photos_kicker, label: "Petite ligne au-dessus du titre Photos",    widget: string }
          - { name: photos_titre,  label: "Titre de la section Photos",                widget: string }

          - name: videos
            label: "Vidéos"
            widget: list
            allow_add: true
            allow_delete: true
            label_singular: Vidéo
            summary: "{{fields.caption}}"
            fields:
              - { name: src,     label: "Fichier vidéo", widget: file, media_library: { config: { multiple: false } } }
              - { name: caption, label: "Légende",        widget: string }

          - name: photos
            label: "Photos"
            widget: list
            allow_add: true
            allow_delete: true
            label_singular: Photo
            summary: "{{fields.caption}}"
            fields:
              - { name: image,   label: "Photo",             widget: image }
              - { name: alt,     label: "Description (SEO)", widget: string }
              - { name: caption, label: "Légende",           widget: string }
